<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiayu Chen 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", serif;
        }
        body {
            background-color: #f5f5f5;
            color: #111111;
            line-height: 1.75;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .navbar {
            padding: 20px 7%;
            border-bottom: 2px solid #d4d4d4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
        }
        .theme-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-left: 20px;
        }
        .nav-links a {
            color: #333;
            text-decoration: none;
            margin-left: 28px;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #2563eb;
        }
        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 25px;
        }
        /* 自我介绍卡片 */
        .about-card {
            background: #fff;
            padding: 45px 35px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            margin-bottom: 45px;
            transition: all 0.2s ease;
        }
        .about-card h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .about-card p {
            font-size: 17px;
            color: #374151;
            line-height: 1.85;
            transition: color 0.2s ease;
        }
        .entry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .entry-card {
            background: #fff;
            padding: 35px 20px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            text-decoration: none;
            color: #111;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .entry-card:hover {
            border-color: #2563eb;
            color: #2563eb;
        }
        footer {
            text-align: center;
            padding: 35px 20px;
            color: #737373;
            font-size: 14px;
            border-top: 2px solid #d4d4d4;
            margin-top: 80px;
            background-color: #fff;
            transition: all 0.2s ease;
        }
        @media (max-width: 768px) {
            .about-card h1 {
                font-size: 26px;
            }
        }
        
        /* 首页专属完整黑夜模式覆盖，没有任何白块遗漏 */
        body.dark-mode {
            background-color: #121212 !important;
            color: #e2e8f0 !important;
        }
        /* 导航栏适配 */
        body.dark-mode .navbar {
            background-color: #1a1a1a !important;
            border-bottom-color: #2d2d2d !important;
        }
        body.dark-mode .logo {
            color: #f0f0f0 !important;
        }
        body.dark-mode .nav-links a {
            color: #cbd5e1 !important;
        }
        body.dark-mode .nav-links a:hover {
            color: #60a5fa !important;
        }
        body.dark-mode .theme-btn {
            background-color: #2d2d2d !important;
            color: #f1f5f9 !important;
            border: 1px solid #444 !important;
        }
        /* 自我介绍卡片适配 */
        body.dark-mode .about-card {
            background-color: #1e1e1e !important;
            border-color: #2d2d2d !important;
        }
        body.dark-mode .about-card h1 {
            color: #f8fafc !important;
        }
        body.dark-mode .about-card p {
            color: #94a3b8 !important;
        }
        /* 入口卡片适配 */
        body.dark-mode .entry-card {
            background-color: #1e1e1e !important;
            border-color: #2d2d2d !important;
            color: #e2e8f0 !important;
        }
        body.dark-mode .entry-card:hover {
            border-color: #3b82f6 !important;
            color: #60a5fa !important;
        }
        /* 页脚适配 */
        body.dark-mode footer {
            background-color: #1a1a1a !important;
            border-top-color: #2d2d2d !important;
            color: #737373 !important;
        }

        /* 保留你原有兼容全站其他页面的暗色规则，全部兼容不冲突 */
        .dark-mode .back-btn {
            color: #60a5fa !important;
        }
        .dark-mode .page-header h1 {
            color: #f8fafc !important;
        }
        .dark-mode .page-header p {
            color: #94a3b8 !important;
        }
        .dark-mode .subject-card {
            background-color: #1e1e1e !important;
            border-color: #2d2d2d !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
        }
        .dark-mode .subject-card h3 {
            color: #f1f5f9 !important;
            border-bottom-color: #2d2d2d !important;
        }
        .dark-mode .subject-card .count {
            color: #94a3b8 !important;
        }
        .dark-mode .note-list {
            border-top: 1px solid #2d2d2d !important;
            background-color: #1e1e1e !important;
        }
        .dark-mode .note-list a {
            color: #cbd5e1 !important;
            border-bottom: 1px dashed #2d2d2d !important;
        }
        .dark-mode .note-list a:hover {
            color: #60a5fa !important;
            background-color: #252525 !important;
        }
        .dark-mode .definition { background-color: #1a273a; border-left-color: #3b82f6; }
        .dark-mode .theorem { background-color: #182a1f; border-left-color: #22c55e; }
        .dark-mode .proof { background-color: #2b2716; border-left-color: #f59e0b; }
        .dark-mode .action-group a {
            background-color: #2d2a1e !important;
            color: #fbbf24 !important;
        }
        .dark-mode .book-item {
            border-bottom-color: #2d2d2d !important;
        }
        .dark-mode .book-title {
            color: #60a5fa !important;
        }
        .dark-mode .book-author {
            color: #94a3b8 !important;
        }
        .dark-mode .book-comment {
            color: #888 !important;
            border-left-color: #333 !important;
        }
        .dark-mode .math-analysis { border-left-color: #3b82f6 !important; }
        .dark-mode .linear-algebra { border-left-color: #8b5cf6 !important; }
        .dark-mode .point-topology { border-left-color: #ec4899 !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Jiayu Chen</div>
        <button class="theme-btn" id="themeToggle">🌙 黑夜模式</button>
        <div class="nav-links">
            <a href="catalog.html">笔记目录</a>
            <a href="views.html">思考日志</a>
        </div>
    </nav>

    <div class="container">
        <div class="about-card">
            <h1>你好，我是陈嘉宇</h1>
            <p>香港中文大学（深圳）本科生，纯数学方向学习者，感兴趣的方向是代数几何和数理逻辑中的集合论，会在这里分享数学笔记与个人思考记录。</p>
        </div>

        <div class="entry-grid">
            <a href="catalog.html" class="entry-card">全部学科笔记目录</a>
            <a href="views.html" class="entry-card">个人数学思考日志</a>
        </div>
    </div>

    <footer>
        © 2026 Jiayu Chen
    </footer>
    
    <!-- 内联主题JS，删掉旧的dark-theme.js完全避免冲突 -->
    <script>
        const themeToggle = document.getElementById('themeToggle');
        const savedDark = localStorage.getItem('darkMode') === 'true';

        if(savedDark) {
            document.body.classList.add('dark-mode');
            themeToggle.textContent = '☀️ 日间模式';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const nowDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('darkMode', nowDark);
            themeToggle.textContent = nowDark ? '☀️ 日间模式' : '🌙 黑夜模式';
        });
    </script>

</body>
</html>
