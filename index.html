<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiayu Chen 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", serif;
        }
        body {
            background-color: #f5f5f5;
            color: #111111;
            line-height: 1.75;
        }
        .navbar {
            padding: 20px 7%;
            border-bottom: 2px solid #d4d4d4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
        }
        .nav-links a {
            color: #333;
            text-decoration: none;
            margin-left: 28px;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #2563eb;
        }
        .container {
            max-width: 900px;
            margin: 80px auto;
            padding: 0 25px;
        }
        .hero-card {
            background: #fff;
            padding: 50px 30px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 50px;
        }
        .hero-card h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .entry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .entry-card {
            background: #fff;
            padding: 35px 20px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            text-decoration: none;
            color: #111;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            transition: border-color 0.2s ease;
        }
        .entry-card:hover {
            border-color: #2563eb;
            color: #2563eb;
        }
        footer {
            text-align: center;
            padding: 35px 20px;
            color: #737373;
            font-size: 14px;
            border-top: 2px solid #d4d4d4;
            margin-top: 80px;
            background-color: #fff;
        }
        @media (max-width: 768px) {
            .hero-card h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Jiayu Chen</div>
        <div class="nav-links">
            <a href="catalog.html">笔记目录</a>
            <a href="views.html">思考日志</a>
        </div>
    </nav>

    <div class="container">
        <div class="hero-card">
            <h1>纯数学笔记库</h1>
        </div>

        <div class="entry-grid">
            <a href="catalog.html" class="entry-card">全部学科笔记目录</a>
            <a href="views.html" class="entry-card">个人数学思考日志</a>
        </div>
    </div>

    <footer>
        © 2026 Jiayu Chen
    </footer>
</body>
</html>
