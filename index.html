<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiayu Chen 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", serif;
        }
        body {
            background-color: #f5f5f5;
            color: #111111;
            line-height: 1.75;
        }
        .navbar {
            padding: 20px 7%;
            border-bottom: 2px solid #d4d4d4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
        }
        .nav-links a {
            color: #333;
            text-decoration: none;
            margin-left: 28px;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #2563eb;
        }
        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 25px;
        }
        /* 自我介绍卡片 */
        .about-card {
            background: #fff;
            padding: 45px 35px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            margin-bottom: 45px;
        }
        .about-card h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .about-card p {
            font-size: 17px;
            color: #374151;
            line-height: 1.85;
        }
        .entry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .entry-card {
            background: #fff;
            padding: 35px 20px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            text-decoration: none;
            color: #111;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            transition: border-color 0.2s ease;
        }
        .entry-card:hover {
            border-color: #2563eb;
            color: #2563eb;
        }
        footer {
            text-align: center;
            padding: 35px 20px;
            color: #737373;
            font-size: 14px;
            border-top: 2px solid #d4d4d4;
            margin-top: 80px;
            background-color: #fff;
        }
        @media (max-width: 768px) {
            .about-card h1 {
                font-size: 26px;
            }
        }
        
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Jiayu Chen</div>
        <button class="theme-btn" id="themeToggle">🌙 黑夜模式</button>
        <div class="nav-links">
            <a href="catalog.html">笔记目录</a>
            <a href="views.html">思考日志</a>
        </div>
    </nav>

    <div class="container">
        <!-- 个人自我介绍卡片 -->
        <div class="about-card">
            <h1>你好，我是陈嘉宇</h1>
            <p>香港中文大学（深圳）本科生，纯数学方向学习者，感兴趣的方向是数论和代数几何，会在这里分享数学笔记与个人思考记录。</p>
        </div>

        <div class="entry-grid">
            <a href="catalog.html" class="entry-card">全部学科笔记目录</a>
            <a href="views.html" class="entry-card">个人数学思考日志</a>
        </div>
    </div>

    <footer>
        © 2026 Jiayu Chen
    </footer>
    
<script src="dark-theme.js"></script>

</body>
</html>
