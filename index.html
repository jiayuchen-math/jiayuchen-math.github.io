<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiayu Chen 个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", serif;
        }
        body {
            background-color: #f5f5f5;
            color: #111111;
            line-height: 1.75;
        }
        .navbar {
            padding: 20px 7%;
            border-bottom: 2px solid #d4d4d4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
        }
        .logo {
            font-size: 20px;
            font-weight: 700;
        }
        .nav-links a {
            color: #333;
            text-decoration: none;
            margin-left: 28px;
            font-size: 15px;
        }
        .nav-links a:hover {
            color: #2563eb;
        }
        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 25px;
        }
        /* 自我介绍卡片 */
        .about-card {
            background: #fff;
            padding: 45px 35px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            margin-bottom: 45px;
        }
        .about-card h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .about-card p {
            font-size: 17px;
            color: #374151;
            line-height: 1.85;
        }
        .entry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }
        .entry-card {
            background: #fff;
            padding: 35px 20px;
            border: 2px solid #d4d4d4;
            border-radius: 8px;
            text-decoration: none;
            color: #111;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            transition: border-color 0.2s ease;
        }
        .entry-card:hover {
            border-color: #2563eb;
            color: #2563eb;
        }
        footer {
            text-align: center;
            padding: 35px 20px;
            color: #737373;
            font-size: 14px;
            border-top: 2px solid #d4d4d4;
            margin-top: 80px;
            background-color: #fff;
        }
        @media (max-width: 768px) {
            .about-card h1 {
                font-size: 26px;
            }
        }
                /* 补全版黑夜模式公共样式，覆盖所有卡片框容器，100%无白块残留 */
        .dark-mode {
            background-color: #121212 !important;
            color: #e5e5e5;
        }
        /* 所有通用卡片、容器、导航、页脚全部变黑 */
        .dark-mode .navbar,
        .dark-mode .note-card,
        .dark-mode footer,
        .dark-mode .sidebar-toc,
        .dark-mode .card,
        .dark-mode .note-item,
        .dark-mode .catalog-card,
        .dark-mode .index-card,
        .dark-mode .module-box,
        .dark-mode .content-box,
        .dark-mode .container-box,
        .dark-mode .main-card,
        .dark-mode .site-card {
            background-color: #1e1e1e !important;
            border-color: #333333 !important;
            color: #e5e5e5;
        }
        /* 所有文本元素统一适配深色模式颜色 */
        .dark-mode h1, .dark-mode h2, .dark-mode h3, .dark-mode h4, .dark-mode h5, .dark-mode h6,
        .dark-mode p, .dark-mode li, .dark-mode span, .dark-mode a,
        .dark-mode .note-meta, .dark-mode th, .dark-mode td,
        .dark-mode .card-title, .dark-mode .card-text,
        .dark-mode .catalog-title, .dark-mode .catalog-desc,
        .dark-mode .index-title, .dark-mode .index-text {
            color: #e5e5e5 !important;
            border-color: #333333;
        }
               /* ============================================================
           黑夜模式核心适配 (Dark Mode Styles)
           ============================================================ */
        
        /* 1. 基础背景与全局文字 */
        .dark-mode {
            background-color: #121212 !important;
            color: #e2e8f0 !important;
        }
        
        /* 2. 导航栏适配 */
        .dark-mode .navbar {
            background-color: #1a1a1a !important;
            border-bottom: 1px solid #2d2d2d !important;
        }
        
        .dark-mode .back-btn {
            color: #60a5fa !important;
        }
        
        /* 3. 页面标题与描述 */
        .dark-mode .page-header h1 {
            color: #f8fafc !important;
        }
        
        .dark-mode .page-header p {
            color: #94a3b8 !important;
        }
        
        /* 4. 重灾区：学科卡片 (subject-card) 适配 */
        .dark-mode .subject-card {
            background-color: #1e1e1e !important; /* 统一卡片深色背景 */
            border-color: #2d2d2d !important;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
        }
        
        .dark-mode .subject-card h3 {
            color: #f1f5f9 !important;
            border-bottom-color: #2d2d2d !important;
        }
        
        .dark-mode .subject-card .count {
            color: #94a3b8 !important;
        }
        
        /* 5. 笔记列表 (note-list) 及链接适配 */
        .dark-mode .note-list {
            border-top: 1px solid #2d2d2d !important;
            background-color: #1e1e1e !important;
        }
        
        .dark-mode .note-list a {
            color: #cbd5e1 !important;
            border-bottom: 1px dashed #2d2d2d !important;
        }
        
        .dark-mode .note-list a:hover {
            color: #60a5fa !important;
            background-color: #252525 !important;
        }
        
        /* 6. 特殊区块（定义、定理等，如果页面中有） */
        .dark-mode .definition { background-color: #1a273a; border-left-color: #3b82f6; }
        .dark-mode .theorem { background-color: #182a1f; border-left-color: #22c55e; }
        .dark-mode .proof { background-color: #2b2716; border-left-color: #f59e0b; }
        
        /* 7. 交互按钮适配 */
        .dark-mode .theme-btn {
            background-color: #2d2d2d !important;
            color: #f1f5f9 !important;
            border: 1px solid #444 !important;
        }
        
        .dark-mode .action-group a {
            background-color: #2d2a1e !important; /* 暗金色背景 */
            color: #fbbf24 !important; /* 亮金色文字 */
        }
        
        /* 8. 书单页特有样式适配 (如果是booklist.html) */
        .dark-mode .book-item {
            border-bottom-color: #2d2d2d !important;
        }
        .dark-mode .book-title {
            color: #60a5fa !important;
        }
        .dark-mode .book-author {
            color: #94a3b8 !important;
        }
        .dark-mode .book-comment {
            color: #888 !important;
            border-left-color: #333 !important;
        }
        
        /* 强制保留左侧彩色边条（这是你设计的灵魂，在暗色下更好看） */
        .dark-mode .math-analysis { border-left-color: #3b82f6 !important; }
        .dark-mode .linear-algebra { border-left-color: #8b5cf6 !important; }
        .dark-mode .point-topology { border-left-color: #ec4899 !important; }
        /* ... 其他颜色条会自动保留原生设置，无需全部重写 */
        
        /* ============================================================
           适配结束
           ============================================================ */

    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Jiayu Chen</div>
        <button class="theme-btn" id="themeToggle">🌙 黑夜模式</button>
        <div class="nav-links">
            <a href="catalog.html">笔记目录</a>
            <a href="views.html">思考日志</a>
        </div>
    </nav>

    <div class="container">
        <!-- 个人自我介绍卡片 -->
        <div class="about-card">
            <h1>你好，我是陈嘉宇</h1>
            <p>香港中文大学（深圳）本科生，纯数学方向学习者，感兴趣的方向是数论和代数几何，会在这里分享数学笔记与个人思考记录。</p>
        </div>

        <div class="entry-grid">
            <a href="catalog.html" class="entry-card">全部学科笔记目录</a>
            <a href="views.html" class="entry-card">个人数学思考日志</a>
        </div>
    </div>

    <footer>
        © 2026 Jiayu Chen 
    </footer>
    
<script src="dark-theme.js"></script>

</body>
</html>
